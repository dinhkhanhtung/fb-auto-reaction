<!-- TEST HTML FOR FACEBOOK FEED SIMULATION -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test SAR Extension - Facebook Mock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            background: #fff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: #1877f2;
            font-size: 20px;
            margin-bottom: 5px;
        }

        .header p {
            color: #65676b;
            font-size: 12px;
        }

        [role="article"] {
            background: #fff;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .post-author {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #e4e6eb;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #65676b;
        }

        .author-info {
            flex: 1;
        }

        .author-name {
            font-weight: 600;
            color: #050505;
            font-size: 14px;
        }

        .post-time {
            color: #65676b;
            font-size: 12px;
        }

        .post-content {
            color: #050505;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        [role="toolbar"] {
            display: flex;
            gap: 8px;
            padding-top: 8px;
            border-top: 1px solid #e5e7eb;
        }

        button[aria-label*="Thích"],
        button[aria-label*="Like"],
        [role="button"] {
            flex: 1;
            padding: 8px;
            background: #f0f2f5;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            color: #65676b;
            transition: background 0.2s;
        }

        button[aria-label*="Thích"]:hover,
        button[aria-label*="Like"]:hover,
        [role="button"]:hover {
            background: #e4e6eb;
        }

        .console-widget {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: #1e1e1e;
            border-top: 1px solid #333;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            overflow-y: auto;
            z-index: 10000;
        }

        .console-line {
            margin: 2px 0;
            font-size: 10px;
        }

        .console-success { color: #00ff00; }
        .console-info { color: #00ff00; }
        .console-warn { color: #ff9800; }
        .console-error { color: #ff4444; }
        .console-debug { color: #00ccff; }

        .test-controls {
            background: #fff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            position: sticky;
            top: 20px;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .test-controls h3 {
            color: #1877f2;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .test-btn {
            background: #1877f2;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 6px;
            margin-bottom: 6px;
        }

        .test-btn:hover {
            background: #165bc0;
        }

        .toggle-console {
            position: fixed;
            bottom: 10px;
            right: 10px;
            z-index: 9999;
            background: #1877f2;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        .toggle-console:hover {
            background: #165bc0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧪 Test Harness - SAR Extension</h1>
        <p>Dùng để test extension trên mock Facebook feed</p>
    </div>

    <div class="test-controls">
        <h3>⚙️ Điều Khiển Test</h3>
        <button class="test-btn" onclick="simulateSarScan()">1️⃣ Giả lập Scan</button>
        <button class="test-btn" onclick="addTestPosts()">2️⃣ Thêm Posts</button>
        <button class="test-btn" onclick="simulateReaction()">3️⃣ Phản ứng Test</button>
        <button class="test-btn" onclick="clearConsole()">🗑️ Clear Console</button>
        <button class="test-btn" onclick="toggleConsole()">📊 Toggle Console</button>
    </div>

    <div id="feed"></div>

    <div class="console-widget" id="console">
        <div class="console-line">
            <span style="color: #999;">[Console Output]</span>
        </div>
    </div>

    <button class="toggle-console" onclick="toggleConsole()">📊 Log</button>

    <!-- Mock Facebook reactions popup -->
    <div id="reaction-popup" style="display: none; position: fixed; background: #fff; padding: 8px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); z-index: 999;">
        <button onclick="reactWith('like')" style="background: none; border: none; font-size: 20px; cursor: pointer;">👍</button>
        <button onclick="reactWith('love')" style="background: none; border: none; font-size: 20px; cursor: pointer;">❤️</button>
        <button onclick="reactWith('haha')" style="background: none; border: none; font-size: 20px; cursor: pointer;">😆</button>
        <button onclick="reactWith('wow')" style="background: none; border: none; font-size: 20px; cursor: pointer;">😮</button>
        <button onclick="reactWith('sad')" style="background: none; border: none; font-size: 20px; cursor: pointer;">😢</button>
        <button onclick="reactWith('angry')" style="background: none; border: none; font-size: 20px; cursor: pointer;">😠</button>
    </div>

    <script>
        const testPosts = [
            {
                author: "Người Bạn 1",
                time: "2 giờ trước",
                content: "Chúc mừng sinh nhật mình! Cảm ơn mọi người đã gửi lời chúc mừng. Hôm nay vui lắm! 🎉🎂"
            },
            {
                author: "Người Bạn 2",
                time: "1 giờ trước",
                content: "Haha quá buồn cười! 😆😆 Xem cái này rồi thì không còn gì tổ chức hơn."
            },
            {
                author: "Người Bạn 3",
                time: "30 phút trước",
                content: "Wow! Thật tuyệt vời!!! 😮 Không ngờ được gặp bạn ở đây. Xịn lắm."
            },
            {
                author: "Quảng Cáo Test",
                time: "Lúc nãy",
                content: "Mua ngay! Giảm giá 50%! Cài đặt dễ dàng. Inbox để biết thêm chi tiết."
            },
            {
                author: "Bài Drama",
                time: "Vừa rồi",
                content: "Phốt lớn được phát hiện! Cẩn thận! Cảnh báo: không tin tưởng người này."
            }
        ];

        function log(type, message, data = '') {
            const timestamp = new Date().toLocaleTimeString();
            const consoleEl = document.getElementById('console');
            const line = document.createElement('div');
            line.className = `console-line console-${type}`;
            const dataStr = data ? ` ${JSON.stringify(data)}`.substring(0, 100) : '';
            line.textContent = `[SAR ${timestamp}] [${type}] ${message}${dataStr}`;
            consoleEl.appendChild(line);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        function addTestPosts() {
            const feed = document.getElementById('feed');
            feed.innerHTML = '';
            
            testPosts.forEach((post, idx) => {
                const article = document.createElement('div');
                article.setAttribute('role', 'article');
                article.setAttribute('data-ft', `post_${idx}_${Date.now()}`);
                article.innerHTML = `
                    <div class="post-author">
                        <div class="avatar">${post.author.charAt(0)}</div>
                        <div class="author-info">
                            <div class="author-name">${post.author}</div>
                            <div class="post-time">${post.time}</div>
                        </div>
                    </div>
                    <div class="post-content">${post.content}</div>
                    <div role="toolbar" style="display: flex; gap: 8px;">
                        <button aria-label="Thích" onclick="handleLikeClick(this)">👍 Thích</button>
                        <button aria-label="Bình luận">💬 Bình luận</button>
                        <button aria-label="Chia sẻ">📤 Chia sẻ</button>
                    </div>
                `;
                feed.appendChild(article);
            });
            
            log('info', 'Thêm 5 test posts');
        }

        function handleLikeClick(btn) {
            log('info', 'Like button clicked');
            // Show reaction popup
            const popup = document.getElementById('reaction-popup');
            const rect = btn.getBoundingClientRect();
            popup.style.left = rect.left + 'px';
            popup.style.top = (rect.top - 50) + 'px';
            popup.style.display = 'flex';
        }

        function reactWith(type) {
            const popup = document.getElementById('reaction-popup');
            popup.style.display = 'none';
            log('success', `Reaction added: ${type}`, { reaction: type });
        }

        function simulateSarScan() {
            log('info', 'Starting mock SAR scan...');
            const articles = document.querySelectorAll('[role="article"]');
            log('info', `Found ${articles.length} posts to process`);
            
            articles.forEach((art, idx) => {
                const text = art.innerText.substring(0, 50);
                log('info', `Post ${idx + 1} preview`, text);
            });
        }

        function simulateReaction() {
            const articles = document.querySelectorAll('[role="article"]');
            let successCount = 0;
            
            articles.forEach((art, idx) => {
                const btn = art.querySelector('button[aria-label*="Thích"]');
                if (btn) {
                    successCount++;
                    log('success', `Reaction added to post ${idx + 1}: thích`);
                } else {
                    log('warn', `Like button not found on post ${idx + 1}`);
                }
            });
            
            log('success', `Simulated reaction complete: ${successCount}/${articles.length} reacted`);
        }

        function clearConsole() {
            const consoleEl = document.getElementById('console');
            consoleEl.innerHTML = '<div class="console-line"><span style="color: #999;">[Console Cleared]</span></div>';
        }

        function toggleConsole() {
            const consoleEl = document.getElementById('console');
            consoleEl.style.display = consoleEl.style.display === 'none' ? 'block' : 'none';
        }

        // Load test posts on startup
        window.addEventListener('load', () => {
            addTestPosts();
            log('success', 'Test page loaded. Use buttons to simulate SAR behavior.');
        });
    </script>
</body>
</html>
