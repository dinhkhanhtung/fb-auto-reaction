<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Auto Reaction</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container compact-mode">
        <!-- Header -->
        <div class="header">
            <div class="logo-area">
                <img src="ic/ic32.png" alt="Logo" class="header-logo">
                <div class="title-container">
                    <h1>Smart Auto Reaction</h1>
                    <span class="premium-badge">PREMIUM</span>
                </div>
            </div>
            <button id="btn-log" class="btn-icon" title="Activity Log">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="12" y1="13" x2="8" y2="13"></line>
                    <line x1="12" y1="17" x2="8" y2="17"></line>
                </svg>
            </button>
            <button id="btn-settings" class="btn-icon" title="Settings">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3" />
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
            </button>
            <button id="btn-back" class="btn-icon" style="display: none;" title="Back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
            </button>
        </div>

        <!-- Main View -->
        <div id="main-page" class="page active main-view">

            <!-- Power Button Area -->
            <div class="power-container">
                <button id="btn-toggle" class="power-button">
                    <div class="power-glow"></div>
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                        <line x1="12" y1="2" x2="12" y2="12"></line>
                    </svg>
                </button>
            </div>

            <!-- Stats Area -->
            <div class="stats-compact">
                <div class="stat-row">
                    <span class="stat-label">Đã xử lý</span>
                    <span class="stat-val" id="posts-processed">0</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-row">
                    <span class="stat-label">Cảm xúc</span>
                    <span class="stat-val highlighted" id="reactions-added">0</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-row">
                    <span class="stat-label">Bỏ qua</span>
                    <span class="stat-val muted" id="posts-skipped">0</span>
                </div>
            </div>

            <!-- Performance Dashboard -->
            <div class="performance-dashboard">
                <h4 style="text-align: center; color: #0f0; margin: 10px 0; font-size: 12px;">📊 Hôm nay</h4>
                <div class="perf-stats">
                    <div class="perf-stat">
                        <span class="perf-label">Cảm xúc</span>
                        <span class="perf-value" id="today-reacted">0</span>
                    </div>
                    <div class="perf-stat">
                        <span class="perf-label">Quét</span>
                        <span class="perf-value" id="today-scans">0</span>
                    </div>
                    <div class="perf-stat">
                        <span class="perf-label">Lỗi</span>
                        <span class="perf-value" id="today-errors">0</span>
                    </div>
                </div>
            </div>

            <!-- Footer Main (Chân đế vững chãi) -->
            <div class="footer-main">
                <div class="footer-content">
                    <span class="version-tag">v2.0.0</span>
                    <a href="https://facebook.com/me/allactivity?category_key=likes" target="_blank" class="log-link">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                        Xem nhật ký hoạt động
                    </a>
                </div>
            </div>
        </div>

        <!-- Settings View (Scrollable) -->
        <div id="settings-page" class="page settings-view">
            <div class="settings-scroll-area">
                <div class="settings-section">
                    <h3>Cài đặt chung</h3>
                    <div class="setting-item">
                        <label for="startup">Tự khởi động</label>
                        <label class="switch">
                            <input type="checkbox" id="startup">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label for="ignore-fanpage">Bỏ qua Fanpage</label>
                        <label class="switch"><input type="checkbox" id="ignore-fanpage"><span
                                class="slider"></span></label>
                    </div>
                    <div class="setting-item">
                        <label for="ignore-group">Bỏ qua Group</label>
                        <label class="switch"><input type="checkbox" id="ignore-group"><span
                                class="slider"></span></label>
                    </div>
                    <div class="setting-item">
                        <label for="time-period">Tần suất (phút)</label>
                        <input type="number" id="time-period" class="input-number" min="1" max="60" value="5">
                    </div>
                </div>

                <div class="settings-section">
                    <h3>Bộ lọc AI</h3>
                    <div class="setting-item">
                        <label for="filter-enabled">Bật bộ lọc</label>
                        <label class="switch">
                            <input type="checkbox" id="filter-enabled">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label for="avoid-politics">Tránh chính trị</label>
                        <label class="switch"><input type="checkbox" id="avoid-politics"><span
                                class="slider"></span></label>
                    </div>
                    <div class="setting-item">
                        <label for="avoid-controversial">Tránh tranh cãi</label>
                        <label class="switch"><input type="checkbox" id="avoid-controversial"><span
                                class="slider"></span></label>
                    </div>
                    <div class="setting-item">
                        <label for="avoid-ads">Tránh quảng cáo</label>
                        <label class="switch"><input type="checkbox" id="avoid-ads"><span class="slider"></span></label>
                    </div>
                </div>

                <div class="settings-section">
                    <h3>Cảm xúc thả</h3>
                    <div class="reaction-selector icon-only">
                        <label class="reaction-option"><input type="radio" name="reaction" value="auto" checked><span
                                class="reaction-emoji">🤖</span></label>
                        <label class="reaction-option"><input type="radio" name="reaction" value="like"><span
                                class="reaction-emoji">👍</span></label>
                        <label class="reaction-option"><input type="radio" name="reaction" value="love"><span
                                class="reaction-emoji">❤️</span></label>
                        <label class="reaction-option"><input type="radio" name="reaction" value="care"><span
                                class="reaction-emoji">🤗</span></label>
                        <label class="reaction-option"><input type="radio" name="reaction" value="haha"><span
                                class="reaction-emoji">😆</span></label>
                        <label class="reaction-option"><input type="radio" name="reaction" value="wow"><span
                                class="reaction-emoji">😮</span></label>
                    </div>
                </div>

                <div class="settings-section">
                    <h3>🛡️ An ninh nâng cao</h3>
                    <div class="setting-item">
                        <label for="max-reactions-hour">Tối đa cảm xúc/giờ</label>
                        <input type="number" id="max-reactions-hour" class="input-number" min="5" max="100" value="30">
                    </div>
                    <div class="setting-item">
                        <label for="enable-smart-delay">Bật Smart Delay</label>
                        <label class="switch">
                            <input type="checkbox" id="enable-smart-delay" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <label for="enable-schedule">Bật lịch hoạt động</label>
                        <label class="switch">
                            <input type="checkbox" id="enable-schedule">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div id="schedule-inputs" style="display: none;">
                        <div class="setting-item">
                            <label for="schedule-start">Từ (HH:mm)</label>
                            <input type="time" id="schedule-start" value="09:00">
                        </div>
                        <div class="setting-item">
                            <label for="schedule-end">Đến (HH:mm)</label>
                            <input type="time" id="schedule-end" value="23:00">
                        </div>
                    </div>
                </div>

                <div class="settings-section">
                    <h3>⚙️ Quản lý dữ liệu</h3>
                    <button id="btn-reset-stats" class="btn-danger btn-full">🔄 Reset Thống kê</button>
                    <button id="btn-clear-log" class="btn-danger btn-full" style="margin-top: 8px;">🗑️ Xóa Activity Log</button>
                </div>

                <div class="settings-footer">
                    <button id="btn-save" class="btn-primary btn-full">💾 Lưu cấu hình</button>
                </div>
            </div>
        </div>

        <!-- Activity Log View -->
        <div id="log-page" class="page log-view">
            <div class="log-header">
                <h3>📊 Activity Log</h3>
                <div class="log-controls">
                    <select id="log-filter">
                        <option value="all">Tất cả</option>
                        <option value="success">✅ Thành công</option>
                        <option value="skipped">⏭️ Bỏ qua</option>
                        <option value="error">❌ Lỗi</option>
                    </select>
                    <button id="btn-export-log" class="btn-small">📥 Export CSV</button>
                </div>
            </div>
            <div id="log-list" class="log-list">
                <div class="log-empty">Chưa có hoạt động</div>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
